name: API CI/CD - GHCR + VPS

on:
  push:
    branches:
      - main
    paths:
      - ApiFestaJulina/**
      - .github/workflows/main_apifestajunina.yml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./ApiFestaJulina
          file: ./ApiFestaJulina/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/api-festajunina:latest
            ghcr.io/${{ github.repository_owner }}/api-festajunina:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/festajunina
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            COMPOSE_FILE=docker-compose.yml
            if [ -f docker-compose.vps.yml ]; then
              COMPOSE_FILE=docker-compose.vps.yml
            fi

            docker compose -f "$COMPOSE_FILE" pull api
            docker compose -f "$COMPOSE_FILE" up -d api
            docker image prune -f
          