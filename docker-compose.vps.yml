services:
  db:
    image: mysql:8.0
    container_name: festa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - festa_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER}/api-festajunina:latest
    container_name: festa_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnectionFestaJunina: Server=db;Port=3306;Database=${MYSQL_DATABASE};User Id=${MYSQL_USER};Password=${MYSQL_PASSWORD};SslMode=None;Connection Timeout=30;
      Jwt__Key: ${JWT_KEY}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_1}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_2}
      EmailSettings__Email: ${EMAIL_USER}
      EmailSettings__Senha: ${EMAIL_PASS}
      AzureBlobStorage__ServiceUri: ${AZURE_BLOB_SERVICE_URI}
      AzureBlobStorage__ContainerName: ${AZURE_BLOB_CONTAINER}
      AzureBlobStorage__ConnectionString: ${AZURE_BLOB_CONNECTION_STRING}
    ports:
      - "8080:8080"
    networks:
      - festa_net

volumes:
  db_data:

networks:
  festa_net:
    driver: bridge
